name: Cloudflare Free Preview

on:
  push:
    branches: [codex/cloudflare-free-preview]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: konseycomics-free-preview
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'konseycomics/konseycomics' && github.ref == 'refs/heads/codex/cloudflare-free-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_KEY }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .next/cache/konsey-static-history
            .next/cache/konsey-asset-release.json
          key: preview-public-assets-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: preview-public-assets-${{ runner.os }}-
      - run: npm ci --no-audit --no-fund
      - name: Preview security and data tests
        run: node --test tests/cloudflare-*.test.mjs tests/public-reader.test.mjs tests/reader-preferences.test.mjs tests/relative-time.test.mjs tests/seo-rules.test.mjs tests/series-archive.test.mjs
      - run: npm run build:vinext
      - name: Deploy only the existing preview Worker
        run: npm run deploy:vinext
        env:
          CLOUDFLARE_ACCOUNT_ID: '8494c13b77031af3f835c47c1fca6611'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
      - name: Check deployed authentication boundaries
        run: node scripts/check-cloudflare-account-preview.mjs
      - name: Check free static image delivery
        run: node scripts/check-free-media.mjs
